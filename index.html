<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coin Pusher</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#151d33;--text:#f5f7ff;--muted:#aab4d0;--accent:#ffd35a;--danger:#ff7676}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(#111a30,#080c17);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
    main{width:min(100%,760px);padding:16px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.card{background:var(--panel);border:1px solid #2b385e;border-radius:14px;padding:10px;text-align:center}.label{font-size:12px;color:var(--muted)}.value{font-size:24px;font-weight:800}
    .game-wrap{background:#070b14;border:1px solid #2b385e;border-radius:18px;padding:8px;box-shadow:0 12px 40px #0008}.stage{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:12px;background:#1b263b;touch-action:manipulation}.stage canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:10px;right:10px;top:10px;text-align:center;font-size:13px;color:#eef4ffcc;pointer-events:none;text-shadow:0 1px 4px #000}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{min-height:48px;border:0;border-radius:14px;font-size:16px;font-weight:800;background:var(--accent);color:#332600}button.secondary{background:#263352;color:var(--text)}button:disabled{opacity:.45}.status{min-height:24px;margin-top:8px;text-align:center;color:var(--muted);font-size:14px}.small{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}
  </style>
</head>
<body>
<main>
  <div class="hud">
    <div class="card"><div class="label">所持コイン</div><div id="stock" class="value">50</div></div>
    <div class="card"><div class="label">獲得</div><div id="won" class="value">0</div></div>
    <div class="card"><div class="label">台上</div><div id="onboard" class="value">0</div></div>
  </div>
  <div class="game-wrap">
    <div id="stage" class="stage" aria-label="コインプッシャーゲーム盤">
      <canvas id="game"></canvas>
      <div class="hint">盤面をタップしてコイン投入位置を選択</div>
    </div>
  </div>
  <div class="controls">
    <button id="drop" type="button">中央に投入</button>
    <button id="restart" class="secondary" type="button">リスタート</button>
  </div>
  <div id="status" class="status" aria-live="polite"></div>
  <div class="small">手前の赤いラインを越えたコインを獲得します。左右に落ちたコインは失われます。</div>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const stockEl = document.getElementById('stock');
  const wonEl = document.getElementById('won');
  const onboardEl = document.getElementById('onboard');
  const statusEl = document.getElementById('status');
  const dropBtn = document.getElementById('drop');
  const restartBtn = document.getElementById('restart');

  let W=400,H=500,scale=1,last=0,stock=50,won=0,nextId=1,coins=[];
  const coinR=9, gravity=32, damping=.988, restitution=.18;
  const board={left:34,right:366,top:62,bottom:455,ledgeY:390};
  const pusher={y:185,h:74,minY:164,maxY:225,speed:36,dir:1};

  function resize(){
    const r=stage.getBoundingClientRect();
    scale=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    canvas.width=Math.round(r.width*scale); canvas.height=Math.round(r.height*scale);
    canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
    W=400; H=500;
  }

  function reset(){
    stock=50;won=0;nextId=1;coins=[];pusher.y=185;pusher.dir=1;
    for(let y=290;y<385;y+=19){for(let x=75+(y%38?9:0);x<330;x+=20){if(Math.random()>.18) coins.push(makeCoin(x+Math.random()*3,y+Math.random()*3));}}
    statusEl.textContent='ゲーム開始'; updateHud();
  }
  function makeCoin(x,y){return{id:nextId++,x,y,vx:0,vy:0,r:coinR};}
  function updateHud(){stockEl.textContent=stock;wonEl.textContent=won;onboardEl.textContent=coins.length;dropBtn.disabled=stock<=0;}

  function dropAt(screenX){
    if(stock<=0){statusEl.textContent='コインがありません。リスタートしてください。';return;}
    const x=Math.max(board.left+coinR,Math.min(board.right-coinR,screenX));
    const c=makeCoin(x,76); c.vy=42; coins.push(c); stock--; statusEl.textContent='1枚投入'; updateHud();
  }

  function collide(a,b){
    const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
    if(d2<=0||d2>=rr*rr)return;
    const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,over=rr-d;
    a.x-=nx*over*.5;a.y-=ny*over*.5;b.x+=nx*over*.5;b.y+=ny*over*.5;
    const rvx=b.vx-a.vx,rvy=b.vy-a.vy,sep=rvx*nx+rvy*ny;
    if(sep<0){const j=-(1+restitution)*sep*.5;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;}
  }

  function step(dt){
    pusher.y+=pusher.dir*pusher.speed*dt;if(pusher.y>pusher.maxY){pusher.y=pusher.maxY;pusher.dir=-1}else if(pusher.y<pusher.minY){pusher.y=pusher.minY;pusher.dir=1}
    const px1=board.left+14,px2=board.right-14,py1=pusher.y,py2=pusher.y+pusher.h;
    for(const c of coins){
      c.vy+=gravity*dt;c.vx*=Math.pow(damping,dt*60);c.vy*=Math.pow(damping,dt*60);c.x+=c.vx*dt;c.y+=c.vy*dt;
      if(c.y<board.ledgeY){
        if(c.x-c.r<board.left){c.x=board.left+c.r;c.vx=Math.abs(c.vx)*.25}
        if(c.x+c.r>board.right){c.x=board.right-c.r;c.vx=-Math.abs(c.vx)*.25}
      }
      if(c.x>px1-c.r&&c.x<px2+c.r&&c.y+c.r>py1&&c.y-c.r<py2){
        const dTop=Math.abs((c.y+c.r)-py1),dBottom=Math.abs(py2-(c.y-c.r));
        if(dTop<dBottom){c.y=py1-c.r;c.vy=Math.min(c.vy,-8)}else{c.y=py2+c.r;c.vy=Math.max(c.vy,pusher.dir>0?pusher.speed*.65:6)}
      }
    }
    for(let pass=0;pass<2;pass++)for(let i=0;i<coins.length;i++)for(let j=i+1;j<coins.length;j++)collide(coins[i],coins[j]);
    let gained=0,lost=0;
    coins=coins.filter(c=>{
      if(c.y-c.r>board.bottom){if(c.x>board.left+20&&c.x<board.right-20){gained++;return false}else{lost++;return false}}
      if(c.y>board.ledgeY&& (c.x<board.left-18||c.x>board.right+18)){lost++;return false}
      return c.y<H+50;
    });
    if(gained){won+=gained;stock+=gained;statusEl.textContent=`${gained}枚ゲット！`;}
    else if(lost){statusEl.textContent=`${lost}枚は横に落下`;}
    if(gained||lost)updateHud();
  }

  function draw(){
    const sx=canvas.width/W,sy=canvas.height/H;ctx.setTransform(sx,0,0,sy,0,0);ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#33496b');g.addColorStop(1,'#141d2d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0b1324';ctx.fillRect(0,0,board.left,H);ctx.fillRect(board.right,0,W-board.right,H);
    ctx.fillStyle='#2b3f5f';ctx.fillRect(board.left,board.top,board.right-board.left,board.bottom-board.top);
    ctx.fillStyle='#152036';ctx.fillRect(board.left,board.ledgeY,board.right-board.left,board.bottom-board.ledgeY);
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(board.left+18,board.bottom);ctx.lineTo(board.right-18,board.bottom);ctx.stroke();
    ctx.fillStyle='#7387a9';ctx.fillRect(board.left+14,pusher.y,board.right-board.left-28,pusher.h);ctx.fillStyle='#93a5c2';ctx.fillRect(board.left+14,pusher.y,board.right-board.left-28,8);
    for(const c of coins){
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fillStyle='#d6a92e';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ffe081';ctx.stroke();ctx.beginPath();ctx.arc(c.x,c.y,c.r*.55,0,Math.PI*2);ctx.strokeStyle='#a77913';ctx.lineWidth=1;ctx.stroke();
    }
    ctx.fillStyle='#ffffffaa';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('DROP ZONE',W/2,48);
  }

  function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop);}
  stage.addEventListener('pointerdown',e=>{const r=stage.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;dropAt(x);});
  dropBtn.addEventListener('click',()=>dropAt(W/2));restartBtn.addEventListener('click',reset);window.addEventListener('resize',resize);
  resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
